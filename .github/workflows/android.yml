name: Android build

on:
  push:
    branches: [kmp]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (signed)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Verify APK signatures
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort | tail -1)"
          echo "Using $APKSIGNER"
          shopt -s nullglob
          for apk in androidApp/build/outputs/apk/{debug,release}/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk"
            sha256sum "$apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: androidApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: androidApp-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
